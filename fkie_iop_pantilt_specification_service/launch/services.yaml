/**:
  ros__parameters:
    iop_services:
      - fkie_iop_discovery/Discovery
      - fkie_iop_pantilt_specification_service/PanTiltSpecification
      - fkie_iop_pantilt_specification_service/PanTiltMotionProfile

    PanTiltSpecificationService:
      origin: "0 0 0 0 0 0" # the position of the pantilt on the robot [x y z roll pitch yaw]
      joint1: "pan_name -3.14 3.14 1.57" # the ROS name of the first joint and movement specifications [name (optional: minValue maxValue maxSpeed)]
      joint2: "tilt_name -3.14 3.14 1.57" # the ROS name of the second joint and movement specifications [name (optional: minValue maxValue maxSpeed)]
